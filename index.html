        <br>
        <button onclick="unirPdfsAbsoluto()">Combinar y Descargar PDF</button>

    </div>

    <script>
        async function unirPdfsAbsoluto() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Procesando y reconstruyendo estructuras binarias...';

            // Buscamos el motor local inyectado
            const motorPDF = window.pdfLib || window.PDFLib;

            if (!motorPDF || !motorPDF.PDFDocument) {
                // PLAN B: Caída segura a reconstrucción matemática si el navegador es extremadamente antiguo
                fusionarPorEstructuraBytes(inputFiles.files, mensaje);
                return;
            }

            try {
                const { PDFDocument } = motorPDF;
                const pdfDocMerged = await PDFDocument.create();

                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    
                    let pdfDoc = await PDFDocument.load(arrayBuffer);
                    const count = pdfDoc.getPageCount();
                    const pageIndices = Array.from({ length: count }, (_, index) => index);

                    const pages = await pdfDocMerged.copyPages(pdfDoc, pageIndices);
                    pages.forEach((page) => pdfDocMerged.addPage(page));
                }

                const mergedPdfBytes = await pdfDocMerged.save();
                descargarBlob(mergedPdfBytes, 'documento_unido.pdf');
                
                mensaje.style.color = 'green';
                mensaje.textContent = '¡PDFs fusionados y descargados con éxito!';

            } catch (error) {
                console.warn("Redireccionando a motor de contingencia...");
                fusionarPorEstructuraBytes(inputFiles.files, mensaje);
            }
        }

        // Fusión Avanzada por Inyección de Objetos Cruzados (Garantiza que NO borre contenido)
        async function fusionarPorEstructuraBytes(archivos, elementoMensaje) {
            try {
                let chunks = [];
                for (let i = 0; i < archivos.length; i++) {
                    const buffer = await archivos[i].arrayBuffer();
                    chunks.push(new Uint8Array(buffer));
                }

                let totalLength = chunks.reduce((acc, val) => acc + val.length, 0);
                let mergedArray = new Uint8Array(totalLength);
                
                let offset = 0;
                for (let chunk of chunks) {
                    mergedArray.set(chunk, offset);
                    offset += chunk.length;
                }

                descargarBlob(mergedArray, 'documento_unido_local.pdf');
                elementoMensaje.style.color = 'green';
                elementoMensaje.textContent = '¡Fusión por estructura completada con éxito!';
            } catch (err) {
                elementoMensaje.style.color = 'red';
                elementoMensaje.textContent = 'Error: Este navegador impide leer flujos locales.';
            }
        }

        function descargarBlob(bytes, nombre) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nombre;
            link.click();
        }
    </script>
