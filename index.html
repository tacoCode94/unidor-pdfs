<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs Fácilmente - Servidor</title>

    <!-- CDN Oficiales que se activarán al estar en un Host -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background: #f4f4f9;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            background: #fafafa;
            border: 1px dashed #ccc;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        #mensaje {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>

        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button onclick="unirPdfsServidor()">Combinar y Descargar PDF</button>

        <div id="mensaje"></div>
    </div>

    <script>
        async function unirPdfsServidor() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Procesando archivos en el servidor seguro...';

            // Mapeo adaptativo de la librería global
            const motorPDF = window.PDFLib || window.pdfLib;

            if (!motorPDF) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error: Esperando conexión con el servidor de librerías. Si estás probando en local (file://), recuerda subirlo a un hosting web para activar este motor.';
                return;
            }

            try {
                const { PDFDocument } = motorPDF;
                const pdfDocMerged = await PDFDocument.create();

                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();

                    let pdfDoc;
                    try {
                        pdfDoc = await PDFDocument.load(arrayBuffer);
                    } catch (loadError) {
                        throw new Error(`El archivo "${file.name}" está encriptado, protegido o dañado.`);
                    }

                    const count = pdfDoc.getPageCount();
                    const pageIndices = Array.from({ length: count }, (_, index) => index);

                    const pages = await pdfDocMerged.copyPages(pdfDoc, pageIndices);
                    pages.forEach((page) => pdfDocMerged.addPage(page));
                }

                const mergedPdfBytes = await pdfDocMerged.save();

                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'documento_unido.pdf';
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡PDFs unidos y descargados con éxito!';
            } catch (error) {
                console.error(error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error: ' + error.message;
            }
        }
    </script>

</body>
</html>
