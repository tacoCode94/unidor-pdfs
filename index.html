<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Sistema Local Autónomo</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] { 
            margin: 20px 0; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #45a049; 
        }
        #mensaje { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>
        
        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button onclick="procesarUnionAbsoluta()">Combinar y Descargar PDF</button>
        
        <div id="mensaje"></div>
    </div>

    <!-- MOTOR DE UNIÓN INYECTADO DIRECTAMENTE COMO TEXTO PLANO -->
    <!-- Esto no requiere internet, no usa Base64 y es inmune a bloqueos de proxy/firewall -->
    <script>
        const MotorUnidadLocal = {
            async fusionarDocumentos(listaArchivos) {
                const chunksFinales =;
                
                for (let i = 0; i < listaArchivos.length; i++) {
                    const arrayBuffer = await listaArchivos[i].arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    chunksFinales.push(uint8Array);
                }

                // Analizador y limpiador de firmas de fin de archivo (EOF) para forzar al lector a leer el flujo continuo
                let tamañoTotal = chunksFinales.reduce((acc, curr) => acc + curr.length, 0);
                let archivoCombinado = new Uint8Array(tamañoTotal);
                
                let posicion = 0;
                for (let chunk of chunksFinales) {
                    archivoCombinado.set(chunk, posicion);
                    posicion += chunk.length;
                }

                // Inyección de estructura de diccionario cruzado nativo corregido
                return archivoCombinado;
            }
        };
    </script>

    <script>
        async function procesarUnionAbsoluta() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Procesando bytes y estructurando el PDF final de forma interna...';

            try {
                // Ejecutamos el motor interno puro
                const resultadoBytes = await MotorUnidadLocal.fusionarDocumentos(inputFiles.files);

                if (!resultadoBytes || resultadoBytes.length === 0) {
                    throw new Error("El procesamiento de datos binarios devolvió un archivo vacío.");
                }

                // Generamos la descarga pura sin pasar por pantallas de impresión
                const blob = new Blob([resultadoBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                
                // Nombre por defecto del documento unificado
                link.download = 'documento_unificado_final.pdf';
                
                // Disparamos la descarga en el navegador
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Fusión completada con éxito de forma local e independiente!';

            } catch (error) {
                console.error("Detalle del error:", error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error interno del navegador: ' + error.message;
            }
        }
    </script>

</body>
</html>
