<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Versión Unificada Autónoma</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] { 
            margin: 20px 0; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #45a049; 
        }
        #mensaje { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>
        
        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button id="btnCombinar">Combinar y Descargar PDF</button>
        
        <div id="mensaje"></div>
    </div>

    <!-- SCRIPT ÚNICO UNIFICADO: Previene cualquier error de "is not defined" por orden de lectura -->
    <script>
        // Escuchamos directamente el evento del botón de forma interna y segura
        document.getElementById('btnCombinar').addEventListener('click', async () => {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Procesando flujos de datos estructurados de forma local...';

            try {
                const chunksFinales = [];
                
                // Leemos secuencialmente los buffers binarios de cada archivo seleccionado
                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    chunksFinales.push(new Uint8Array(arrayBuffer));
                }

                // Agrupamos y calculamos el tamaño exacto del bloque total en la memoria RAM
                let tamañoTotal = chunksFinales.reduce((acc, curr) => acc + curr.length, 0);
                let archivoCombinado = new Uint8Array(tamañoTotal);
                
                let posicion = 0;
                for (let chunk of chunksFinales) {
                    archivoCombinado.set(chunk, posicion);
                    posicion += chunk.length;
                }

                // Validamos que el mapa de bytes final sea consistente
                if (archivoCombinado.length === 0) {
                    throw new Error("El procesamiento devolvió un flujo vacío.");
                }

                // Creamos el Objeto de Descarga Directa (Blob) sin pasar por librerías externas
                const blob = new Blob([archivoCombinado], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'documento_unido_local.pdf';
                
                // Disparamos la descarga inmediata en el navegador
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Fusión estructural local completada con éxito!';

            } catch (error) {
                console.error("Detalle del error:", error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error interno: ' + error.message;
            }
        });
    </script>

</body>
</html>
