<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Versión Autónoma Total</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] { 
            margin: 20px 0; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #45a049; 
        }
        #mensaje { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>
        
        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button onclick="procesarUnionPdfs()">Combinar y Descargar PDF</button>
        
        <div id="mensaje"></div>
    </div>

    <!-- INYECTOR AUTÓNOMO DEL MOTOR REAL DE PDF-LIB (Inmune a bloqueos CORS de red) -->

                const elementoScript = document.createElement('script');
                elementoScript.text = decodificado;

    </script>

    <script>
        async function procesarUnionPdfs() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Analizando y reconstruyendo metadatos binarios en local...';

            // Buscamos el motor inyectado de forma interna e independiente
            const motorActivo = window.PDFLib || window.pdfLib;

            if (!motorActivo) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Fallo de contingencia del sistema. Tu navegador no soporta decodificación Base64.';
                return;
            }

            try {
                const { PDFDocument } = motorActivo;
                const pdfFinal = await PDFDocument.create();

                // Recorremos los archivos cargados mapeando sus contenidos binarios estructurales reales
                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Carga segura del mapa de bytes
                    const pdfIndividual = await PDFDocument.load(arrayBuffer);
                    const totalPaginas = pdfIndividual.getPageCount();
                    const indicesPaginas = Array.from({ length: totalPaginas }, (_, index) => index);

                    // Clonamos las páginas sin romper los streams internos de fuentes ni gráficos
                    const paginasCopiadas = await pdfFinal.copyPages(pdfIndividual, indicesPaginas);
                    paginasCopiadas.forEach((pagina) => pdfFinal.addPage(pagina));
                }

                // Generamos los bytes del PDF reconstruído
                const bytesFinales = await pdfFinal.save();
                
                // Forzamos la descarga directa del Blob estructurado
                const blob = new Blob([bytesFinales], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'documento_unido_completo.pdf';
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Fusión completada! Todos tus PDFs se unieron con su contenido real intacto.';

            } catch (error) {
                console.error(error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error durante la compilación binaria: ' + error.message;
            }
        }
    </script>

</body>
</html>
