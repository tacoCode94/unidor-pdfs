<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Versión Estable GitHub</title>
    
    <!-- CARGA DEFINITIVA: Servidor jsDelivr inmune a bloqueos CORS de producción en GitHub -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] { 
            margin: 20px 0; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #45a049; 
        }
        #mensaje { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>
        
        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button onclick="unirPdfsGithub()">Combinar y Descargar PDF</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        async function unirPdfsGithub() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Iniciando fusión de páginas reales...';

            // Captura segura e inequívoca del motor global inyectado por jsDelivr
            const motorPDF = window.PDFLib || window.pdfLib;

            if (!motorPDF) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error: No se pudo enlazar el motor PDF-lib en la red actual. Revisa tu conexión.';
                return;
            }

            try {
                const { PDFDocument } = motorPDF;
                // Creamos el contenedor del PDF final vacío
                const pdfDocMerged = await PDFDocument.create();

                // Procesamos cada uno de los archivos cargados
                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Cargamos el PDF individual de manera binaria completa
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    
                    // Extraemos los índices exactos de sus páginas reales
                    const count = pdfDoc.getPageCount();
                    const pageIndices = Array.from({ length: count }, (_, index) => index);

                    // Copiamos las páginas con sus contenidos completos (gráficos, fuentes y textos)
                    const pages = await pdfDocMerged.copyPages(pdfDoc, pageIndices);
                    
                    // Añadimos cada página secuencialmente al documento final
                    pages.forEach((page) => pdfDocMerged.addPage(page));
                }

                // Compilamos la estructura final del nuevo PDF unificado
                const mergedPdfBytes = await pdfDocMerged.save();
                
                // Forzamos la descarga del archivo binario puro procesado
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'documento_unido.pdf';
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Todos los archivos se han unificado y descargado con éxito!';

            } catch (error) {
                console.error("Detalle técnico del error:", error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error durante la combinación: ' + error.message;
            }
        }
    </script>

</body>
</html>
