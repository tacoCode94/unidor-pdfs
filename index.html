<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Canal Estable cdnjs</title>
    
    <!-- CAMBIO DE RED CONFIABLE: Usamos el servidor global de cdnjs (Cloudflare) -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
            background: #f4f4f9; 
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] { 
            margin: 20px 0; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #45a049; 
        }
        #mensaje { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unir Archivos PDF</h1>
        <p>Selecciona tus archivos PDF (mantén presionado Ctrl o Cmd para elegir varios):</p>
        
        <input type="file" id="archivosPdf" accept="application/pdf" multiple>
        <br>
        <button onclick="unirPdfsCdnjs()">Combinar y Descargar PDF</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        async function unirPdfsCdnjs() {
            const inputFiles = document.getElementById('archivosPdf');
            const mensaje = document.getElementById('mensaje');

            if (inputFiles.files.length < 2) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Por favor selecciona al menos 2 archivos PDF.';
                return;
            }

            mensaje.style.color = '#333';
            mensaje.textContent = 'Leyendo estructuras y acoplando páginas...';

            // Captura el motor en el entorno global inyectado por Cloudflare cdnjs
            const motorPDF = window.PDFLib || window.pdfLib;

            if (!motorPDF) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error crítico: La nueva red cdnjs también está bloqueada. Por favor recarga o prueba desde otro navegador o red de datos.';
                return;
            }

            try {
                const { PDFDocument } = motorPDF;
                // Inicializamos el documento de destino real vacío
                const pdfDocMerged = await PDFDocument.create();

                // Procesamos secuencialmente el contenido binario de cada archivo
                for (let i = 0; i < inputFiles.files.length; i++) {
                    const file = inputFiles.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Carga completa e indexación de páginas
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    const count = pdfDoc.getPageCount();
                    const pageIndices = Array.from({ length: count }, (_, index) => index);

                    // Copiado físico real de textos, fuentes y gráficos vectoriales
                    const pages = await pdfDocMerged.copyPages(pdfDoc, pageIndices);
                    pages.forEach((page) => pdfDocMerged.addPage(page));
                }

                // Compilamos los datos binarios finales reconstruidos
                const mergedPdfBytes = await pdfDocMerged.save();
                
                // Forzamos la descarga del Blob consolidado final
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'documento_unido.pdf';
                link.click();

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Fusión completada! El PDF con todo su contenido real se ha descargado.';
            } catch (error) {
                console.error("Detalle técnico del error:", error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error al combinar: ' + error.message;
            }
        }
    </script>

</body>
</html>
